pre-commit:
  commands:
    no-resolved-paths:
      glob: "{plugin/agents/*.md,plugin/skills/**/*.md}"
      run: |
        for file in {staged_files}; do
          if grep -qF "$HOME/brain/learning-loop" "$file" 2>/dev/null || \
             grep -qF "~/brain/learning-loop" "$file" 2>/dev/null || \
             grep -qF "$HOME/brain/brain" "$file" 2>/dev/null || \
             grep -qF "~/brain/brain" "$file" 2>/dev/null; then
            echo "ERROR: $file contains resolved paths — use PLUGIN or {{VAULT}} tokens"
            exit 1
          fi
        done

    prettier:
      # Both depths needed: lefthook's glob requires "**" to match at least
      # one directory, so the deep pattern alone misses direct children like
      # plugin/hooks/pre-write-check.js.
      glob:
        - "{plugin/hooks,plugin/scripts}/*.{js,mjs}"
        - "{plugin/hooks,plugin/scripts}/**/*.{js,mjs}"
      run: npx --no-install prettier --check {staged_files}
      stage_fixed: true

    eslint:
      glob:
        - "{plugin/hooks,plugin/scripts}/*.{js,mjs}"
        - "{plugin/hooks,plugin/scripts}/**/*.{js,mjs}"
      run: npx eslint {staged_files}

    test:
      glob: "{plugin/hooks,plugin/scripts,tests,plugin/agents,plugin/skills,native}/**"
      run: npm test --silent

    cargo-test:
      glob: "native/**"
      run: cargo test --workspace --quiet --manifest-path native/Cargo.toml

    # `cargo test` builds no bench target, so nothing here compiled
    # benches/index_reindex.rs and it sat broken from the commit that gave
    # EmbedItem a `note_uuid` until somebody ran `cargo bench` by hand.
    # `check` rather than `test --all-targets`: the latter would RUN a bench
    # over ten thousand notes on every commit, and what rotted was the
    # compile.
    cargo-check-benches:
      glob: "native/**"
      run: cargo check --benches --workspace --quiet --manifest-path native/Cargo.toml
