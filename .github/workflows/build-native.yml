name: Build ll-search

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: ll-search-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: ll-search-linux-x64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: ll-search-windows-x64

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (libdbus-1-dev for keyring sync-secret-service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      # Keyed on a manual version tag, NOT build.rs's hash: editing build.rs
      # (e.g. adding download retry) must not bust the cache and force a fresh
      # HuggingFace fetch. Bump `v6` only when the pinned model/SHA changes.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            native/crates/ll-search/model
            native/model-cache
          key: native-model-v6

      - name: Build
        env:
          LL_MODEL_CACHE_DIR: ${{ github.workspace }}/native/model-cache
        run: cargo build --release --locked -p ll-search --features nli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ll-search dist/
          tar -czf ../${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\ll-search.exe dist\
          Compress-Archive -Path dist\* -DestinationPath ..\${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Generate SHA256SUMS
        run: |
          find . -name '*.tar.gz' -o -name '*.zip' | while read -r f; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.tar.gz
            **/*.zip
            SHA256SUMS
          generate_release_notes: true
