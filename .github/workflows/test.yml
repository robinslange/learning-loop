name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The plugin ships a Windows binary and win32 code paths, so the Node suite
  # runs on all three OSes. macOS and Linux are blocking; Windows is
  # continue-on-error until its failures are triaged green (flip it to
  # blocking then — a red-but-ignored lane decays fast). ygrep is a
  # Linux-only install: its tests skip when the binary is absent.
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ygrep
        if: runner.os == 'Linux'
        env:
          YGREP_VERSION: 3.2.4
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yetidevworks/ygrep/releases/download/v${YGREP_VERSION}/ygrep-${YGREP_VERSION}-linux-x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ygrep
          sudo chmod +x /usr/local/bin/ygrep
          ygrep --version

      - name: Run tests
        run: npm test

      # The truncation contract tests skip without a real binary; on CI that
      # meant the contract was never enforced. Download the pinned release
      # binary AFTER the main run (the missing-binary test in the NLI failures
      # suite must see a binary-less tree) and re-run the contract file with a
      # skip guard. Bump LL_BINARY_VERSION when the envelope contract changes;
      # it is pinned (not package.json-derived) so a release commit doesn't
      # race the build-native workflow that publishes its own artifacts.
      # v1.26.1 has no release because its build-native run failed (W4 hardens
      # this); the truncation contract (schema_version 1 + truncated field) is
      # stable across these versions.
      - name: Install ll-search release binary
        if: runner.os == 'Linux'
        env:
          LL_BINARY_VERSION: v1.27.1
        run: |
          set -euo pipefail
          mkdir -p native/target/release
          curl -fsSL "https://github.com/robinslange/learning-loop/releases/download/${LL_BINARY_VERSION}/ll-search-linux-x64.tar.gz" \
            | tar -xz -C native/target/release
          chmod +x native/target/release/ll-search
          native/target/release/ll-search version

      # Maintained list of binary-gated suites: every test file that skips
      # when ll-search is absent must be re-run here, post-install, with the
      # skip guard — otherwise it silently never executes in CI (the main
      # `npm test` above runs binary-less by design). When adding a test with
      # a hasBinary() skip, add its file to this list.
      - name: Binary-gated tests (must not skip)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for suite in \
            tests/edge-infer-nli-truncation.test.mjs \
            tests/convergence-check-keys.test.mjs; do
            out=$(node --test --test-reporter=tap "$suite")
            echo "$out"
            if echo "$out" | grep -qE '^# skipped [1-9]'; then
              echo "ERROR: $suite skipped tests — binary install step is broken"
              exit 1
            fi
          done

  cargo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (libdbus-1-dev for keyring sync-secret-service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-test-${{ hashFiles('native/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --workspace

  # Retrieval-quality regression gate: runs ll-search eval-funnel against a
  # seeded fixture vault and hard-fails on a >3% absolute drop in recall@10 /
  # ndcg@10 versus the committed baseline (bench/baselines/quality.json).
  # Covers both short [title] queries and long body-derived [long] queries
  # (the JIT injection distribution). Regenerate the baseline with:
  #   node bench/bench.mjs --quality-only --save-quality-baseline
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build deps (libdbus-1-dev for keyring sync-secret-service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-release-${{ hashFiles('native/Cargo.lock') }}

      - name: Build release binary
        working-directory: native
        run: cargo build --release -p ll-search

      - name: Retrieval quality gate
        run: node bench/bench.mjs --quality-only --compare bench/baselines/quality.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check for resolved paths in agents and skills
        run: |
          set -e
          matches=$(grep -rEl '\$HOME/brain/learning-loop|~/brain/learning-loop|\$HOME/brain/brain|~/brain/brain' plugin/agents plugin/skills 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "ERROR: the following files contain resolved paths — use PLUGIN or {{VAULT}} tokens"
            echo "$matches"
            exit 1
          fi

      - name: Prettier check
        run: npx prettier --check 'plugin/hooks/**/*.{js,mjs}' 'plugin/scripts/**/*.{js,mjs}'

      - name: Lint (eslint custom rules)
        run: npx eslint .

      - name: Code-fence tag check
        run: |
          if grep -rEn '^```(sh|shell|typescript)( |$)' \
              --exclude-dir=vendor \
              plugin/skills/ plugin/agents/ docs/ guide/ plugin/hooks/ plugin/scripts/ \
              CHANGELOG.md README.md \
              --include='*.md' 2>/dev/null; then
            echo "ERROR: non-canonical code-fence tags found. Use bash, js, or ts."
            exit 1
          fi
