name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ygrep
        env:
          YGREP_VERSION: 3.2.4
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yetidevworks/ygrep/releases/download/v${YGREP_VERSION}/ygrep-${YGREP_VERSION}-linux-x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ygrep
          sudo chmod +x /usr/local/bin/ygrep
          ygrep --version

      - name: Run tests
        run: npm test

      # The truncation contract tests skip without a real binary; on CI that
      # meant the contract was never enforced. Download the pinned release
      # binary AFTER the main run (the missing-binary test in the NLI failures
      # suite must see a binary-less tree) and re-run the contract file with a
      # skip guard. Bump LL_BINARY_VERSION when the envelope contract changes;
      # it is pinned (not package.json-derived) so a release commit doesn't
      # race the build-native workflow that publishes its own artifacts.
      # v1.26.1 has no release because its build-native run failed (W4 hardens
      # this); the truncation contract (schema_version 1 + truncated field) is
      # stable across these versions.
      - name: Install ll-search release binary
        env:
          LL_BINARY_VERSION: v1.26.0
        run: |
          set -euo pipefail
          mkdir -p native/target/release
          curl -fsSL "https://github.com/robinslange/learning-loop/releases/download/${LL_BINARY_VERSION}/ll-search-linux-x64.tar.gz" \
            | tar -xz -C native/target/release
          chmod +x native/target/release/ll-search
          native/target/release/ll-search version

      - name: Truncation contract tests (must not skip)
        run: |
          set -euo pipefail
          out=$(node --test --test-reporter=tap tests/edge-infer-nli-truncation.test.mjs)
          echo "$out"
          if echo "$out" | grep -qi '# SKIP'; then
            echo "ERROR: truncation contract tests skipped — binary install step is broken"
            exit 1
          fi

  cargo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (libdbus-1-dev for keyring sync-secret-service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-test-${{ hashFiles('native/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check for resolved paths in agents and skills
        run: |
          set -e
          matches=$(grep -rEl '\$HOME/brain/learning-loop|~/brain/learning-loop|\$HOME/brain/brain|~/brain/brain' agents skills 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "ERROR: the following files contain resolved paths — use PLUGIN or {{VAULT}} tokens"
            echo "$matches"
            exit 1
          fi

      - name: Prettier check
        run: npx prettier --check 'hooks/**/*.{js,mjs}' 'scripts/**/*.{js,mjs}'

      - name: Lint (eslint custom rules)
        run: npx eslint .

      - name: Code-fence tag check
        run: |
          if grep -rEn '^```(sh|shell|typescript)( |$)' \
              --exclude-dir=vendor \
              skills/ agents/ docs/ guide/ hooks/ scripts/ \
              CHANGELOG.md README.md \
              --include='*.md' 2>/dev/null; then
            echo "ERROR: non-canonical code-fence tags found. Use bash, js, or ts."
            exit 1
          fi
