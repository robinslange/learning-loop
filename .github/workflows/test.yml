name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  cargo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (libdbus-1-dev for keyring sync-secret-service)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-test-${{ hashFiles('native/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check for resolved paths in agents and skills
        run: |
          set -e
          matches=$(grep -rEl '\$HOME/brain/learning-loop|~/brain/learning-loop|\$HOME/brain/brain|~/brain/brain' agents skills 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "ERROR: the following files contain resolved paths — use PLUGIN or {{VAULT}} tokens"
            echo "$matches"
            exit 1
          fi

      - name: Prettier check
        run: npx prettier --check 'hooks/**/*.{js,mjs}' 'scripts/**/*.{js,mjs}'

      - name: Code-fence tag check
        run: |
          if grep -rEn '^```(sh|shell|typescript)( |$)' \
              --exclude-dir=vendor \
              skills/ agents/ docs/ guide/ hooks/ scripts/ \
              CHANGELOG.md README.md \
              --include='*.md' 2>/dev/null; then
            echo "ERROR: non-canonical code-fence tags found. Use bash, js, or ts."
            exit 1
          fi
