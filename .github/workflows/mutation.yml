name: Mutation

# A full run takes far longer than the per-push suite (pre-write-check alone is
# about 70 minutes), so it runs weekly and on demand. The job fails when any
# target in bench/mutation-targets.mjs drops below its break threshold.
on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run mutation targets
        run: npm run test:mutation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-${{ github.run_id }}
          path: reports/mutation/
