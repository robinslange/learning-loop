[package]
name = "ll-search"
version = "2.0.2"
edition.workspace = true
description = "Learning loop search binary -- SQLite + ONNX embeddings"
license = "Apache-2.0"

[dependencies]
ll-core = { path = "../ll-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "session"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "tracing", "api-24"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
anyhow = "1"
dirs-next = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
# tokio-tungstenite takes rustls with default-features off, which selects no
# crypto provider, so `ClientConfig::builder()` panics on the first wss://
# connection. Naming rustls here with `ring` is what installs one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
globset = "0.4"
rand = "0.8"
rayon = "1.10"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
bip39 = "2"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "0.10.1"
machine-uid = "0.6.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
hkdf = "0.12"
notify = "7"
ctrlc = "3"
zstd = "0.13"
regex = "1"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"


[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Test-only: mints the certificate the TLS mock hub serves, so the client's
# `MaybeTlsStream::Rustls` exporter arm runs against a real handshake. Its
# `ring` default matches the provider rustls already uses here.
rcgen = "0.14"
criterion = { version = "=0.5", features = ["html_reports"] }
walkdir = "2"

[[bench]]
name = "query_hot_path"
harness = false

[[bench]]
name = "embed_throughput"
harness = false

[[bench]]
name = "index_reindex"
harness = false
