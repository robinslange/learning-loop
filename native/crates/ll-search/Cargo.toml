[package]
name = "ll-search"
version = "1.27.0"
edition.workspace = true
description = "Learning loop search binary -- SQLite + ONNX embeddings"

[dependencies]
ll-core = { path = "../ll-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "session"] }
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
anyhow = "1"
dirs-next = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
globset = "0.4"
rand = "0.8"
rayon = "1.10"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "0.10.1"
machine-uid = "0.6.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
hkdf = "0.12"
notify = "7"
ctrlc = "3"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[features]
default = ["nli"]
nli = []

[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
criterion = { version = "=0.5", features = ["html_reports"] }

[[bench]]
name = "query_hot_path"
harness = false

[[bench]]
name = "embed_throughput"
harness = false

[[bench]]
name = "index_reindex"
harness = false
